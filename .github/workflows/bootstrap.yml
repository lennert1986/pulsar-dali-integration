name: Bootstrap Marketplace files

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/pulsar-dali-integration.zip"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack integration
        run: |
          unzip -o .bootstrap/pulsar-dali-integration.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Pulsar DALI integration v0.12.0" || exit 0
          git push
