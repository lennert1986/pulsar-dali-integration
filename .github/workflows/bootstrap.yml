name: Bootstrap Marketplace files

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk*.b64 | tr -d '\n\r' | base64 -d > /tmp/pulsar-dali-integration.zip
          set +e
          unzip -t /tmp/pulsar-dali-integration.zip
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "ZIP archive is corrupt (unzip exit $rc)"
            exit "$rc"
          fi
      - name: Unpack integration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          unzip -o /tmp/pulsar-dali-integration.zip -d .
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "ZIP extraction failed (unzip exit $rc)"
            exit "$rc"
          fi
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit unpacked files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Pulsar DALI integration v0.12.0" || exit 0
          git push origin HEAD:main
